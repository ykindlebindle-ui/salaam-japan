<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salaam Japan v2 | Pemindai Komposisi</title><style>body{margin:0;background:#f1f8f4;font:16px system-ui,sans-serif;color:#183b2c}*{box-sizing:border-box}header{background:#086447;color:white;padding:24px 18px;border-radius:0 0 24px 24px}main,header>div{max-width:720px;margin:auto}main{padding:14px 14px 50px}.tabs{display:flex;gap:6px}.tabs button{flex:1;font-size:12px;padding:11px 4px}.card{background:white;border-radius:17px;padding:17px;margin:14px 0;box-shadow:0 2px 9px #0001}button{border:0;border-radius:11px;background:#d9f5e5;color:#065f46;font-weight:700;padding:12px;cursor:pointer}button.on,.primary{background:#087a54;color:white}textarea,input,select{width:100%;border:1px solid #b8d0c3;border-radius:10px;padding:12px;font:inherit;margin:7px 0}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid button{text-align:left}h1{margin:4px 0 8px}h2{font-size:22px}.muted{color:#5c7067;font-size:13px}.jp{font-size:22px;line-height:1.5}.result{border-radius:12px;padding:14px;margin-top:14px;background:#fff1c5}.red{background:#fee2e2}.photo{max-width:100%;max-height:340px;object-fit:contain;margin-top:10px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.notice{font-size:13px;color:#65562e}.bar{height:8px;background:#d1fae5;border-radius:10px;overflow:hidden}.fill{height:100%;background:#059669;width:0;transition:width .2s}label{font-weight:650}</style></head><body><header><div><small>TEMAN WISATA MUSLIM • VERSI 2</small><h1>Salaam, Japan! 🇯🇵</h1><div>Tokyo • Nagoya • Kyoto • Osaka • Wakayama</div></div></header><main><nav class="tabs" id="tabs"></nav><div id="page"></div></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let tab='Halal',city='Tokyo',selectedFile=null,imageUrl='',languageFile=null,languageURL='',crop={l:0,t:0,r:100,b:100},languageCrop={l:0,t:0,r:100,b:100};const cities=['Tokyo','Nagoya','Kyoto','Osaka','Wakayama'];const phrases=[['Saya Muslim','私はイスラム教徒です。'],['Saya tidak bisa bahasa Jepang','日本語が話せません。'],['Bolehkah saya lihat komposisinya?','原材料を見せていただけますか？'],['Apakah ada babi atau lemak babi?','豚肉やラードは入っていますか？'],['Apakah ada sake atau mirin?','酒やみりんは入っていますか？'],['Di mana tempat salat?','お祈りできる場所はありますか？'],['Saya tersesat, mohon bantu','道に迷いました。助けてください。'],['Di mana stasiun?','駅はどこですか？']];const rules=[{r:/豚肉|豚脂|ラード|ポーク|pork|lard/i,label:'Babi / lemak babi',risk:'red'},{r:/酒精|アルコール|みりん|味醂|料理酒|清酒|ワイン|リキュール|alcohol|ethanol/i,label:'Alkohol / sake / mirin',risk:'red'},{r:/ゼラチン|gelatin|乳化剤|ショートニング|動物油脂|肉エキス|チキン|ビーフ|牛肉|鶏肉|酵素|香料|エキス/i,label:'Gelatin, daging, atau bahan yang perlu dicek sumbernya',risk:'yellow'}];function speak(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';speechSynthesis.speak(u)}}function maps(q){window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' '+city+' Japan'),'_blank','noopener,noreferrer')}function store(k,v){try{localStorage.setItem(k,v)}catch{}}function saved(k){try{return localStorage.getItem(k)||''}catch{return ''}}function cityMenu(){return '<select id="city">'+cities.map(c=>'<option '+(c===city?'selected':'')+'>'+c+'</option>').join('')+'</select>'}function scan(text){if(!text.trim())return {status:'empty',hits:[]};let hits=rules.filter(x=>x.r.test(text));return {status:hits.some(x=>x.risk==='red')?'red':'yellow',hits}}function displayResult(){const t=$('ingredients').value;const r=scan(t);if(r.status==='empty'){$('result').innerHTML='<div class="result">Masukkan teks komposisi terlebih dahulu.</div>';return}const title=r.status==='red'?'🔴 Ditemukan bahan yang perlu dihindari':'🟡 Belum dapat dipastikan halal';$('result').innerHTML='<div class="result '+(r.status==='red'?'red':'')+'"><strong>'+title+'</strong>'+(r.hits.length?'<ul>'+r.hits.map(h=>'<li>'+esc(h.label)+'</li>').join('')+'</ul>':'<p>Tidak ditemukan kata kunci berisiko yang dikenali.</p>')+'<p class="notice">Ini hanya pemeriksaan kata kunci. OCR bisa keliru dan sumber bahan/proses produksi tidak diketahui. Bukan sertifikasi halal.</p></div>'}
async function loadOCR(){if(window.Tesseract)return;const urls=['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'];for(const url of urls){try{await new Promise((ok,no)=>{let s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=no;document.head.appendChild(s)});if(window.Tesseract)return}catch{}}throw Error('Pustaka OCR tidak dapat diunduh. Pastikan internet aktif.')}
async function prepareImage(file, area){const bmp=await createImageBitmap(file);area=area||{l:0,t:0,r:100,b:100};const sx=Math.round(bmp.width*area.l/100),sy=Math.round(bmp.height*area.t/100),sw=Math.max(20,Math.round(bmp.width*(area.r-area.l)/100)),sh=Math.max(20,Math.round(bmp.height*(area.b-area.t)/100));const max=2600,scale=Math.min(3,max/Math.max(sw,sh));const cv=document.createElement('canvas');cv.width=Math.round(sw*scale);cv.height=Math.round(sh*scale);const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);return cv}
function cropControls(prefix){return '<div class="card" style="background:#f6fbf8"><b>Potong area tulisan</b><p class="muted">Geser batas sampai hanya tulisan yang dibutuhkan terlihat. Untuk bahan makanan, fokuskan pada baris 原材料名.</p><label>Kiri <span id="'+prefix+'lv">0</span>%</label><input type="range" id="'+prefix+'l" min="0" max="70" value="0"><label>Atas <span id="'+prefix+'tv">0</span>%</label><input type="range" id="'+prefix+'t" min="0" max="70" value="0"><label>Kanan <span id="'+prefix+'rv">100</span>%</label><input type="range" id="'+prefix+'r" min="30" max="100" value="100"><label>Bawah <span id="'+prefix+'bv">100</span>%</label><input type="range" id="'+prefix+'b" min="30" max="100" value="100"><canvas id="'+prefix+'cropPreview" class="photo"></canvas></div>'}
function wireCrop(prefix,fileGetter,area){const draw=async()=>{const f=fileGetter();if(!f)return;for(const k of ['l','t','r','b']){area[k]=+$(''+prefix+k).value;$(prefix+k+'v').textContent=area[k]}if(area.r<=area.l+10||area.b<=area.t+10)return;const cv=await prepareImage(f,area),out=$(prefix+'cropPreview'),ctx=out.getContext('2d');out.width=cv.width;out.height=cv.height;ctx.drawImage(cv,0,0)};for(const k of ['l','t','r','b'])$(prefix+k).oninput=draw;return draw}
function extractIngredients(raw){let lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean);let start=lines.findIndex(x=>/原\s*材\s*料\s*名|原材料|材料名/.test(x));if(start<0)return raw;let block=lines.slice(start,start+5);let stop=block.findIndex((x,i)=>i>0&&/^(内容量|保存方法|賞味期限|消費期限|製造者|栄養成分|殺菌|販売者)/.test(x));if(stop>0)block=block.slice(0,stop);return block.join('\n')}
function japaneseScore(t){return (t.match(/[\u3040-\u30ff\u3400-\u9fff]/g)||[]).length}
async function recognizeFile(file,statusId,fillId){await loadOCR();const area=statusId==='progressText'?crop:languageCrop;const canvas=await prepareImage(file,area);const opts={logger:m=>{if(m.status==='recognizing text'){if(fillId)$(fillId).style.width=Math.round(m.progress*100)+'%';$(statusId).textContent='Membaca karakter Jepang: '+Math.round(m.progress*100)+'%'}else $(statusId).textContent='OCR: '+m.status}};const worker=await window.Tesseract.createWorker('jpn',1,opts);try{await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});let a=await worker.recognize(canvas);let text=(a.data.text||'').trim();if(japaneseScore(text)<3)throw Error('Karakter Jepang tidak berhasil dikenali. Jangan gunakan hasil OCR ini untuk memeriksa halal. Foto label lebih dekat dan tegak, atau masukkan teks manual.');return text}finally{await worker.terminate()}}
async function readPhoto(){if(!selectedFile){$('progressText').textContent='Pilih foto terlebih dahulu.';return}const b=$('ocrBtn');b.disabled=true;$('progressText').textContent='Menyiapkan OCR Jepang...';$('fill').style.width='5%';try{let raw=await recognizeFile(selectedFile,'progressText','fill');if(!raw)throw Error('Tulisan tidak terbaca. Foto lebih dekat dan pastikan label terang.');$('ocrRaw').value=raw;$('ingredients').value=extractIngredients(raw);$('progressText').textContent='Teks terbaca. PERIKSA dan koreksi komposisi sebelum analisis.';/* Pemeriksaan hanya setelah pengguna mengonfirmasi hasil OCR. */}catch(e){$('progressText').textContent='OCR gagal: '+e.message+' Silakan ketik teks manual.'}finally{b.disabled=false}}
async function readLanguagePhoto(){if(!languageFile){$('languageStatus').textContent='Pilih foto dahulu.';return}let b=$('languageOCR');b.disabled=true;try{let raw=await recognizeFile(languageFile,'languageStatus');if(!raw)throw Error('Tidak ada tulisan terbaca.');$('languageText').value=raw;$('languageStatus').textContent='Teks Jepang berhasil dibaca. Periksa hasilnya.'}catch(e){$('languageStatus').textContent='OCR gagal: '+e.message}finally{b.disabled=false}}
function render(t){tab=t;$('tabs').innerHTML=['Halal','Bahasa','Peta','Frasa','Catatan'].map(x=>'<button data-tab="'+x+'" class="'+(x===tab?'on':'')+'">'+x+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));let h='';if(t==='Halal')h='<h2>📸 Pemindai bahan makanan Jepang</h2><div class="card"><p>1. Foto label bagian <b>原材料名</b> (komposisi). 2. Tekan <b>Baca foto otomatis</b>. 3. Koreksi teks hasil OCR. 4. Tekan <b>Periksa bahan</b>.</p><input type="file" id="photo" accept="image/*" capture="environment"><div id="photoPreview"></div>'+cropControls('food')+'<button id="ocrBtn" class="primary">📷 Baca foto otomatis</button><div class="bar" style="margin-top:12px"><div class="fill" id="fill"></div></div><p class="muted" id="progressText">OCR membutuhkan internet untuk mengunduh mesin dan bahasa Jepang pada penggunaan pertama.</p><label for="ocrRaw">Semua teks hasil foto (untuk pengecekan)</label><textarea id="ocrRaw" placeholder="Hasil OCR mentah akan muncul di sini"></textarea><label for="ingredients">Komposisi yang dianalisis (koreksi jika perlu)</label><textarea id="ingredients" placeholder="原材料名：牛乳100%"></textarea><p class="notice">Pastikan teks Jepang sudah benar sebelum menekan Periksa bahan. OCR yang salah bisa melewatkan bahan berisiko.</p><button id="checkBtn" class="primary">🔎 Periksa bahan</button><div id="result"></div></div><div class="card"><h3>🍜 Cari restoran halal</h3>'+cityMenu()+'<div class="grid" id="links"></div><p class="muted">Status halal restoran belum diverifikasi.</p></div>';if(t==='Bahasa')h='<h2>🗣️ Bahasa Indonesia → Jepang</h2><div class="card"><textarea id="inputText">Saya tidak makan babi atau alkohol.</textarea><button id="translate" class="primary">Terjemahkan</button><div id="translation"></div><p class="muted">Memerlukan internet; terjemahan mesin tidak selalu tepat.</p></div><div class="card"><h3>📷 Kamera: baca papan dan menu Jepang</h3><input type="file" id="languagePhoto" accept="image/*" capture="environment"><div id="languagePreview"></div>'+cropControls('lang')+'<button class="primary" id="languageOCR">Baca tulisan Jepang dari foto</button><p class="muted" id="languageStatus">OCR Jepang memerlukan internet dan bekerja lebih baik jika gambar dipotong hanya pada bagian tulisan.</p><textarea id="languageText" placeholder="Hasil teks Jepang dapat dikoreksi"></textarea><button id="languageSpeak">🔊 Bacakan bahasa Jepang</button><p class="muted">Terjemahan otomatis Jepang ke Indonesia belum tersedia pada mode kamera ini. Teks bisa disalin ke penerjemah pilihan Anda.</p><button id="languageCopy">Salin teks Jepang</button></div>';if(t==='Peta')h='<h2>🗺️ Jelajahi Jepang</h2>'+cityMenu()+'<div class="grid" id="links"></div><div class="card">🆘 Darurat: <b>110</b> polisi • <b>119</b> ambulans/pemadam</div>';if(t==='Frasa')h='<h2>📖 Frasa Jepang</h2><input id="search" placeholder="Cari frasa"><div id="phrases"></div>';if(t==='Catatan')h='<h2>🏨 Catatan perjalanan</h2><div class="card"><label>Alamat hotel (bahasa Jepang)</label><textarea id="hotel">'+esc(saved('sj_hotel'))+'</textarea><label>Catatan penting</label><textarea id="notes">'+esc(saved('sj_notes'))+'</textarea><p class="muted">Tersimpan di browser perangkat ini.</p></div>';$('page').innerHTML=h;
if(t==='Halal'){$('photo').onchange=e=>{selectedFile=e.target.files?.[0]||null;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=selectedFile?URL.createObjectURL(selectedFile):'';$('photoPreview').innerHTML=imageUrl?'<img class="photo" src="'+imageUrl+'" alt="Foto label bahan makanan">':'';$('progressText').textContent=selectedFile?'Foto dipilih. Tekan Baca foto otomatis.':'Pilih foto terlebih dahulu.'};const redrawFood=wireCrop('food',()=>selectedFile,crop);$('photo').addEventListener('change',()=>setTimeout(redrawFood,50));$('ocrBtn').onclick=readPhoto;$('checkBtn').onclick=displayResult;let links=[['halal restaurant','Restoran halal'],['halal ramen','Ramen halal'],['halal grocery','Toko halal'],['mosque prayer room','Masjid / musala']];setupLinks(links)}if(t==='Peta')setupLinks([['train station','Stasiun'],['bus stop','Halte bus'],['hospital','Rumah sakit'],['mosque','Masjid'],['tourist information','Informasi wisata'],['convenience store','Minimarket']]);if(t==='Bahasa'){$('languagePhoto').onchange=e=>{languageFile=e.target.files?.[0]||null;if(languageURL)URL.revokeObjectURL(languageURL);languageURL=languageFile?URL.createObjectURL(languageFile):'';$('languagePreview').innerHTML=languageURL?'<img class="photo" src="'+languageURL+'" alt="Foto papan atau menu Jepang">':''};const redrawLang=wireCrop('lang',()=>languageFile,languageCrop);$('languagePhoto').addEventListener('change',()=>setTimeout(redrawLang,50));$('languageOCR').onclick=readLanguagePhoto;$('languageSpeak').onclick=()=>speak($('languageText').value);$('languageCopy').onclick=()=>navigator.clipboard?.writeText($('languageText').value).catch(()=>{});$('translate').onclick=async()=>{let text=$('inputText').value;$('translation').textContent='Menerjemahkan...';try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=id|ja');let d=await r.json();let output=d.responseData?.translatedText;if(!output)throw Error();$('translation').innerHTML='<p class="jp">'+esc(output)+'</p><button id="speakTranslation">🔊 Dengarkan</button>';$('speakTranslation').onclick=()=>speak(output)}catch{$('translation').textContent='Terjemahan gagal. Gunakan menu Frasa.'}};}if(t==='Frasa'){const draw=()=>{let q=$('search').value.toLowerCase();$('phrases').innerHTML=phrases.map(([id,jp],i)=>({id,jp,i})).filter(x=>(x.id+x.jp).toLowerCase().includes(q)).map(x=>'<div class="card"><p>'+esc(x.id)+'</p><p class="jp">'+esc(x.jp)+'</p><button data-voice="'+x.i+'">🔊 Dengarkan</button></div>').join('');document.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>speak(phrases[+b.dataset.voice][1]))};$('search').oninput=draw;draw()}if(t==='Catatan'){$('hotel').oninput=e=>store('sj_hotel',e.target.value);$('notes').oninput=e=>store('sj_notes',e.target.value)}}function setupLinks(links){$('city').onchange=e=>city=e.target.value;$('links').innerHTML=links.map(([q,l],i)=>'<button data-link="'+i+'">'+l+' ↗</button>').join('');document.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>maps(links[+b.dataset.link][0]))}render('Halal');
</script></body></html>
